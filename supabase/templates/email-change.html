<!doctype html>
<html lang="zh-CN"><body>
<h1>确认邮箱变更 · Confirm email change</h1>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/account/security">确认变更 · Confirm change</a></p>
<p>请分别确认发送到旧邮箱与新邮箱的邮件，完成后再使用新邮箱登录。若不是你发起的请求，请联系管理员。</p>
<p>Confirm the messages sent to both your old and new address, then sign in with the new address. Contact an administrator if you did not request this.</p>
</body></html>

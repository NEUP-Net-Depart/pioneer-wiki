name: CI

on:
  push:
    branches: [main]
    # Version tags run the same gates, so a release is verified on the commit it
    # points at rather than only on main. release-image.yml starts from this
    # workflow completing for a tag.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIONEER_DATA_SOURCE: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js and cache pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint and comment policy
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

  database:
    name: Verify Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for concurrent database checks
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so CI does not need the GitHub Releases API to resolve
          # `latest`; unauthenticated API calls can be rate limited.
          version: 2.120.0

      - name: Start local Supabase database
        run: supabase start --exclude studio,realtime,imgproxy,inbucket,edge-runtime,logflare,vector

      - name: Reset database from migrations
        run: supabase db reset

      - name: Lint database schema
        run: supabase db lint --local

      - name: Test database authorization and forum transactions
        run: supabase test db

      - name: Test concurrent forum writes
        run: node tools/test-forum-concurrency.mjs supabase_db_pioneer-wiki

  browser:
    name: Verify Chromium browser flows
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIONEER_DATA_SOURCE: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js and cache pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      # CI owns the browser boundary: this downloads the Chromium revision
      # required by the pinned @playwright/test package. System Chrome is not a
      # prerequisite for contributors or GitHub-hosted runners.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium smoke tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
